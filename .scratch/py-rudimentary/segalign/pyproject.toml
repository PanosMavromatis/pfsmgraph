[project]
name = "segalign"
version = "0.1.0"
description = "Sequence Alignment for Computational Music Theory"
readme = "README.md"
authors = [
    { name = "Panos Mavromatis", email = "panos.mavromatis@nyu.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "abjad>=3.3,<3.4",
    "abjad-ext-ipython>=3.3,<3.4",
    "ipykernel>=6.30.1",
    "pandas>=2.3.1",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.9"]
build-backend = "uv_build"
