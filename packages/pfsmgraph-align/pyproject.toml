# pfsmgraph-align -- sequence alignment (DP-heavy, compiled).
#
# Distributes as "pfsmgraph-align", imports as "pfsmgraph.align".
# Common mid-layer: hseg, hmm, and dl all depend on it (PRD §3.4).

[project]
name = "pfsmgraph-align"
version = "0.1.0.dev0"
description = "Sequence alignment for the pfsmgraph family: pure-Python -> Cython -> Numba CUDA wavefront backends."
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Panos Mavromatis", email = "ai.labs@panos-mav.dev" }]
maintainers = [{ name = "Mavromatis AI Labs", email = "ai.labs@panos-mav.dev" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Cython",
]

dependencies = [
    # Published lower bound -- keep honest; a workspace source satisfies any
    # constraint locally, so this only bites pip users after publish (PRD §5.6).
    "pfsmgraph-dataseq>=0.1.0",
    "numpy>=2.1",
]

[project.optional-dependencies]
# "GPU" here means numba-cuda for the anti-diagonal wavefront DP passes (lifecycle
# phase 3, not yet implemented). This is unrelated to dl's torch extra -- do not
# unify the two (PRD §6). Pin the lower bound when the wavefront backend lands.
gpu = ["numba-cuda"]

[build-system]
# meson-python, for both of the reasons this family has. align is a compiled
# member by design -- the DP kernels follow the ADR 0002/0016 lifecycle -- and it
# is additionally one of the five finder-bearing members, which is the reason the
# three *pure* members are on this backend too; that argument lives in
# packages/pfsmgraph-dataseq/pyproject.toml and is not repeated here.
#
# There is no compiled code here yet: meson.build's extension block is a dormant
# `if fs.exists()` guard that activates when the first .pyx appears. That used to
# be the argument for staying on hatchling in the meantime (ADR 0012); it is not,
# because meson-python's namespace-shadowing finder is injected by the editable
# install rather than by compilation, so deferring bought nothing and hid the
# problem behind a trigger that had not fired. NW extension target:
# pfsmgraph.align.algorithms.needleman_wunsch._cython (PRD §11).
requires = ["meson-python", "cython>=3.0", "numpy>=2.1"]
build-backend = "mesonpy"

[tool.uv.sources]
pfsmgraph-dataseq = { workspace = true }
