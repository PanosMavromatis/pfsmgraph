# pfsmgraph-dataseq -- base layer of the family.
#
# Distributes as "pfsmgraph-dataseq", imports as "pfsmgraph.dataseq".
# No intra-family dependencies: keeping this layer free of them is what keeps
# the dependency graph acyclic and the release order unambiguous (PRD §3.4).

[project]
name = "pfsmgraph-dataseq"
version = "0.1.0.dev0"
description = "Data sequence container and symbol-to-code encoder; PyTorch Dataset-compatible base layer of the pfsmgraph family."
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Panos Mavromatis", email = "panos.mav.ai@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
]

# Third-party runtime dependencies (numpy? torch?) are deliberately deferred to
# the dataseq merge -- the dl-derived merge base fixes them (PRD §3.5, §8).
# No intra-family dependencies by design (PRD §3.4, §5.5).
dependencies = []

[build-system]
# Presumed pure-Python (dl-derived base); confirm at merge, switch to
# meson-python only if a compiled inner loop is found (PRD §6, §8).
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src layout + PEP 420: map src/pfsmgraph/ -> pfsmgraph/ in the wheel with no
# __init__.py at the namespace level. This distribution contributes exactly one
# regular subpackage, pfsmgraph/dataseq/.
packages = ["src/pfsmgraph"]
