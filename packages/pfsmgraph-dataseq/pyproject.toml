# pfsmgraph-dataseq -- base layer of the family.
#
# Distributes as "pfsmgraph-dataseq", imports as "pfsmgraph.dataseq".
# No intra-family dependencies: keeping this layer free of them is what keeps
# the dependency graph acyclic and the release order unambiguous (PRD §3.4).

[project]
name = "pfsmgraph-dataseq"
version = "0.1.0"
description = "Data sequence container and symbol-to-code encoder; PyTorch Dataset-compatible base layer of the pfsmgraph family."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Panos Mavromatis", email = "ai.labs@panos-mav.dev" }]
maintainers = [{ name = "Mavromatis AI Labs", email = "ai.labs@panos-mav.dev" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

# Settled at the dataseq merge (2026-08-31). numpy only: codes are int32 arrays,
# which is what align and hmm index dense matrices with in DP inner loops and
# what a Cython or CUDA buffer wants. torch and pandas were both rejected --
# torch.utils.data.Dataset is duck-typed, so a stock DataLoader works against a
# container that never imports torch, and pandas leaves with ingestion, which
# is the caller's business (PRD §3.5, §8; docs/plan/DEFERRED.md).
# No intra-family dependencies by design (PRD §3.4, §5.5).
dependencies = ["numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/PanosMavromatis/pfsmgraph"
Repository = "https://github.com/PanosMavromatis/pfsmgraph"
Documentation = "https://github.com/PanosMavromatis/pfsmgraph/blob/main/docs/api/dataseq/README.md"

[build-system]
# meson-python, though nothing here is compiled and nothing here ever will be.
# The reason is the PEP 420 namespace, not the build: meson-python's editable
# install injects a meta-path finder that replaces pfsmgraph.__path__, so any
# member left on a plain .pth is shadowed and stops importing. Finders chain --
# one that does not recognise a submodule returns None and the import falls
# through -- so the fix is not to stop the finder replacing __path__, it is to
# leave no member relying on __path__. Every member therefore carries a
# meson.build and this backend, pure ones included; this file's own comment is
# the one the other four point at.
#
# Measured on exp/meson-python-namespace 2026-09-04 and recorded as ADR 0018,
# which supersedes ADR 0012 (it deferred the choice to the first .pyx) and
# overrides ADR 0008's per-package build backends. The finder is injected by the
# editable install rather than by compilation, so it appears with no compiled
# code anywhere in the workspace -- which is why 0012's trigger never had to
# fire. ADR 0018 carries the measurements and the two rejected alternatives;
# this comment is the short form, sited where the change is visible.
#
# The wheel layout that [tool.hatch.build.targets.wheel] used to describe is now
# meson.build's install_sources: src/pfsmgraph/dataseq/ -> pfsmgraph/dataseq/,
# with no __init__.py at the namespace level.
requires = ["meson-python"]
build-backend = "mesonpy"
