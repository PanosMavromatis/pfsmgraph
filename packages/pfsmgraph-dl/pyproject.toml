# pfsmgraph-dl -- PyTorch models for symbolic sequences.
#
# Distributes as "pfsmgraph-dl", imports as "pfsmgraph.dl".
# Single distribution: rnn and transformer are plain submodules, not separate
# distributions -- pfsmgraph stays the only namespace tier (PRD §7).

[project]
name = "pfsmgraph-dl"
version = "0.1.0.dev0"
description = "PyTorch models (rnn, transformer) for interpretable modeling of symbolic sequences in the pfsmgraph family."
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Panos Mavromatis", email = "ai.labs@panos-mav.dev" }]
maintainers = [{ name = "Mavromatis AI Labs", email = "ai.labs@panos-mav.dev" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "pfsmgraph-dataseq>=0.1.0",
    "pfsmgraph-align>=0.1",
    # dl's "GPU" mechanism is torch itself -- distinct from the numba-cuda extra
    # on align/hmm (PRD §6). torch is a hard runtime dependency here.
    "torch>=2.2",
]

[build-system]
# Pure-Python (PRD §6).
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Recurses into pfsmgraph/dl/rnn/ and pfsmgraph/dl/transformer/.
packages = ["src/pfsmgraph"]

[tool.uv.sources]
pfsmgraph-dataseq = { workspace = true }
pfsmgraph-align = { workspace = true }
