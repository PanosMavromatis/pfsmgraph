# pfsmgraph-hseg -- hierarchical segmentation.
#
# Distributes as "pfsmgraph-hseg", imports as "pfsmgraph.hseg".
# Interpretability instrument for the outputs of hmm/dl (PRD §1.4).

[project]
name = "pfsmgraph-hseg"
version = "0.1.0.dev0"
description = "Hierarchical segmentation for the pfsmgraph family; segmentation that optimizes sequence alignments across a corpus."
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Panos Mavromatis", email = "ai.labs@panos-mav.dev" }]
maintainers = [{ name = "Mavromatis AI Labs", email = "ai.labs@panos-mav.dev" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "pfsmgraph-dataseq>=0.1.0",
    "pfsmgraph-align>=0.1",
]

[build-system]
# Pure orchestration over align today, and on meson-python for the namespace
# reason spelled out in packages/pfsmgraph-dataseq/pyproject.toml rather than for
# any build one. If hseg turns out to have its own DP recurrence (PRD §6, §8 --
# still open), add cython/numpy to requires; the backend itself needs no change.
requires = ["meson-python"]
build-backend = "mesonpy"

[tool.uv.sources]
pfsmgraph-dataseq = { workspace = true }
pfsmgraph-align = { workspace = true }
