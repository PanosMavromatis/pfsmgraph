# pfsmgraph-hmm -- arc-emission hidden Markov models.
#
# Distributes as "pfsmgraph-hmm", imports as "pfsmgraph.hmm".
# Translated from an existing Lush implementation (PRD §1.3, §1.5).

[project]
name = "pfsmgraph-hmm"
version = "0.3.0.dev0"
description = "Arc-emission hidden Markov models for the pfsmgraph family: frozen parameters, batched Viterbi decoding and Baum-Welch training, with selectable backends; topology search forthcoming."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Panos Mavromatis", email = "ai.labs@panos-mav.dev" }]
maintainers = [{ name = "Mavromatis AI Labs", email = "ai.labs@panos-mav.dev" }]
# Development Status stays at 3 - Alpha for 0.2.0. The package trains, decodes in
# batches and holds five backends to a measured contract, which reads as beta -- but
# topology search, which the description names as forthcoming, is revision 04, and the
# public surface grew substantially across one minor version. Understating maturity
# costs a reader nothing; overstating it invites reliance the version cannot support.
#
# Programming Language :: Cython returns here at 0.2.0. It was dropped for 0.1.0, which
# shipped a pure wheel reaching no compiled kernel, and is true again now that
# backend="cython" is public and the wheels carry the extensions.
#
# The per-interpreter rows mirror CIBW_BUILD in .github/workflows/release.yml exactly,
# so PyPI's sidebar answers "is my Python covered" without reading wheel filenames.
# They are a claim that has to be extended when 3.15 support lands, which is the cost
# of making it at all.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Cython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

dependencies = [
    "pfsmgraph-dataseq>=0.1.0",
    # No pfsmgraph-align, although PRD §5.5's pattern and ADR 0009's graph show one:
    # no module here imports it, and a declared edge lands with its first import
    # (ADR 0019). It returns with the alignment-seeded topology revision, expected
    # 0.4.0 -- docs/plan/DEFERRED.md, "align able to produce a multiple alignment".
    # Higher than dataseq's >=1.24, and deliberately so -- the divergence tracks
    # the pure/compiled split rather than being drift. hmm is a meson-python
    # member (ADR 0005), and build-system.requires below already spells
    # numpy>=2.1; a C extension built against numpy 2.x headers will not run on
    # 1.x, so the runtime floor has to follow the build floor. Reviewed
    # 2026-09-03 against the first numpy code in this package: _numeric.py uses
    # nothing newer than numpy 1.20 (broadcast_shapes is the newest name), so
    # the bound is justified by the compiled future, not by today's API. Do not
    # "correct" it downward on that basis -- lowering it would only have to be
    # undone at the first .pyx, and raising a published lower bound is the
    # breaking direction.
    "numpy>=2.1",
]

# Two extras, one per accelerated backend family, and deliberately not merged
# (ADR 0004): the CPU-parallel backend needs no device, and `gpu` satisfies
# `cpu-parallel` only because numba-cuda depends on numba -- a resolution
# accident. Both are optional because numba imposes a numpy *ceiling* (numba
# 0.61 caps it below 2.2, 0.67 below 2.6), which as a hard dependency would bind
# every consumer, including one who only runs the pure-Python decode. Withheld
# from 0.1.0, when no public call could reach these backends; restored with
# ADR 0021's `backend=`, which can. An extra changes no call's behaviour: the
# default stays "python", and `backends("viterbi")` reports what an install lacks.
[project.optional-dependencies]
# numba>=0.61 is the version phase 3 was measured on (2026-09-10); the lock tests
# 0.67. A floor only has to be honest.
cpu-parallel = ["numba>=0.61"]
# Bare numba-cuda, with no cu12/cu13 toolkit extra: naming a CUDA major would
# decide driver compatibility for every consumer (the dev group picks cu13 for
# this repository only). The numpy<2.5 cap is numba-cuda's, which its metadata
# omits: 0.30.4, still the latest on 2026-09-14, calls np.row_stack at import and
# numpy 2.5 removed it. Drop the cap when a numba-cuda release stops doing that.
# Not on macOS, where numba-cuda publishes no wheel and no sdist: the extra
# installs nothing there, and backends() says numba-cuda is not installed,
# rather than the whole install failing to resolve.
gpu = [
    "numba-cuda>=0.30.4; sys_platform != 'darwin'",
    "numpy<2.5; sys_platform != 'darwin'",
]
# The torch backend of baum_welch (ADR 0021): float64 on CPU, measured on torch
# 2.13.0. Unrelated to gpu: numba-cuda and torch are separate extras with
# separate meanings, and this one needs no device.
torch = ["torch>=2.13"]

[project.urls]
Homepage = "https://github.com/PanosMavromatis/pfsmgraph"
Repository = "https://github.com/PanosMavromatis/pfsmgraph"
Documentation = "https://github.com/PanosMavromatis/pfsmgraph/blob/main/docs/api/hmm/README.md"

[build-system]
# meson-python. The Viterbi decode has a compiled phase-2 kernel, built by
# default; release builds pass -Dcompiled=false (meson.options, and the root
# justfile's `build`) because 0.1.0's public API reaches no compiled kernel, so
# the wheel is py3-none-any. See packages/pfsmgraph-dataseq/pyproject.toml for
# the namespace reason that puts even the pure members on meson-python.
#
# numpy>=2.1 is the build floor, and [project].dependencies above follows it
# rather than the other way round: an extension built against numpy 2.x headers
# will not run on 1.x.
requires = ["meson-python", "cython>=3.0", "numpy>=2.1"]
build-backend = "mesonpy"

[tool.uv.sources]
pfsmgraph-dataseq = { workspace = true }
