# pfsmgraph-hmm -- Baum-Welch training and HMM topology search.
#
# Distributes as "pfsmgraph-hmm", imports as "pfsmgraph.hmm".
# Translated from an existing Lush implementation (PRD §1.3, §1.5).

[project]
name = "pfsmgraph-hmm"
version = "0.1.0.dev0"
description = "HMM Baum-Welch and topology search via state merge/split for the pfsmgraph family."
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Panos Mavromatis", email = "ai.labs@panos-mav.dev" }]
maintainers = [{ name = "Mavromatis AI Labs", email = "ai.labs@panos-mav.dev" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Cython",
]

dependencies = [
    "pfsmgraph-dataseq>=0.1.0",
    "pfsmgraph-align>=0.1",
    # Higher than dataseq's >=1.24, and deliberately so -- the divergence tracks
    # the pure/compiled split rather than being drift. hmm is a meson-python
    # member (ADR 0005), and build-system.requires below already spells
    # numpy>=2.1; a C extension built against numpy 2.x headers will not run on
    # 1.x, so the runtime floor has to follow the build floor. Reviewed
    # 2026-09-03 against the first numpy code in this package: _numeric.py uses
    # nothing newer than numpy 1.20 (broadcast_shapes is the newest name), so
    # the bound is justified by the compiled future, not by today's API. Do not
    # "correct" it downward on that basis -- lowering it would only have to be
    # undone at the first .pyx, and raising a published lower bound is the
    # breaking direction.
    "numpy>=2.1",
]

[project.optional-dependencies]
# numba-cuda for the Baum-Welch core only; unrelated to dl's torch (PRD §6).
gpu = ["numba-cuda"]

[build-system]
# TEMPORARILY hatchling, not meson-python -- see the long note in
# packages/pfsmgraph-align/pyproject.toml. meson-python's editable-install import
# hook shadows the shared `pfsmgraph` namespace, and there is no cythonized code
# here yet (only the Baum-Welch core is ever compiled; meson.build's extension
# block is a dormant `if fs.exists()` guard). The sibling meson.build is kept for
# the switch back. Revert to:
#   requires = ["meson-python", "cython>=3.0", "numpy>=2.1"]
#   build-backend = "mesonpy"
# when the Baum-Welch .pyx lands (PRD §6, §6.1).
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pfsmgraph"]

[tool.uv.sources]
pfsmgraph-dataseq = { workspace = true }
pfsmgraph-align = { workspace = true }
