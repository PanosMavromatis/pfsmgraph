# pfsmgraph-hmm -- arc-emission hidden Markov models.
#
# Distributes as "pfsmgraph-hmm", imports as "pfsmgraph.hmm".
# Translated from an existing Lush implementation (PRD §1.3, §1.5).

[project]
name = "pfsmgraph-hmm"
version = "0.1.0.dev0"
description = "Arc-emission hidden Markov models for the pfsmgraph family: frozen parameters and Viterbi decoding; Baum-Welch training and topology search forthcoming."
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Panos Mavromatis", email = "ai.labs@panos-mav.dev" }]
maintainers = [{ name = "Mavromatis AI Labs", email = "ai.labs@panos-mav.dev" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "pfsmgraph-dataseq>=0.1.0",
    # No pfsmgraph-align, although PRD §5.5's pattern and ADR 0009's graph show one:
    # no module here imports it, and a declared edge lands with its first import
    # (ADR 0019). It returns with the alignment-seeded topology revision, expected
    # 0.4.0 -- docs/plan/DEFERRED.md, "align able to produce a multiple alignment".
    # Higher than dataseq's >=1.24, and deliberately so -- the divergence tracks
    # the pure/compiled split rather than being drift. hmm is a meson-python
    # member (ADR 0005), and build-system.requires below already spells
    # numpy>=2.1; a C extension built against numpy 2.x headers will not run on
    # 1.x, so the runtime floor has to follow the build floor. Reviewed
    # 2026-09-03 against the first numpy code in this package: _numeric.py uses
    # nothing newer than numpy 1.20 (broadcast_shapes is the newest name), so
    # the bound is justified by the compiled future, not by today's API. Do not
    # "correct" it downward on that basis -- lowering it would only have to be
    # undone at the first .pyx, and raising a published lower bound is the
    # breaking direction.
    "numpy>=2.1",
]

# No optional dependencies in 0.1.0, although the Numba CPU-parallel and CUDA
# backends ship: no public call can reach them until a backend-selection API
# exists, and an extra that changes nothing costs its users a numpy ceiling
# while being hard to withdraw later (an upgraded install silently loses it).
# Both return, with the measurements that shaped them, under
# docs/plan/DEFERRED.md "`align` acquiring a backend-selection API".

[build-system]
# meson-python. The Baum-Welch core is the compiled part (revision 03); the
# decode that exists today is pure Python, and meson.build's extension block is a
# dormant `if fs.exists()` guard until that .pyx lands. The backend is not
# waiting on it -- see packages/pfsmgraph-align/pyproject.toml for why the
# compiled trigger turned out to be the wrong one, and
# packages/pfsmgraph-dataseq/pyproject.toml for the namespace reason that puts
# even the pure members here.
#
# numpy>=2.1 is the build floor, and [project].dependencies above follows it
# rather than the other way round: an extension built against numpy 2.x headers
# will not run on 1.x.
requires = ["meson-python", "cython>=3.0", "numpy>=2.1"]
build-backend = "mesonpy"

[tool.uv.sources]
pfsmgraph-dataseq = { workspace = true }
