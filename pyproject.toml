# Workspace root for the pfsmgraph package family.
#
# This is a *virtual* workspace root: it has no [project] table, so it is not
# itself a distributable package. Its only job is to group the five publishable
# members under packages/* so they resolve together against a single uv.lock
# during development (PRD §5.1, §5.6).
#
# The workspace is a development-time construct only. Build backends ignore the
# [tool.uv.*] tables, and published wheels carry ordinary PyPI dependencies, so
# pip users never know a workspace existed (PRD §5.3).

[tool.uv.workspace]
members = ["packages/*"]

# All five members are meson-python editable installs (see
# packages/pfsmgraph-dataseq/pyproject.toml for why the pure ones are too), and
# the generated editable loader bakes an *absolute* path to ninja at build time
# rather than consulting PATH. Under build isolation that path points into a
# temporary directory uv deletes once the build finishes, so every subsequent
# import dies FileNotFoundError before the namespace question is even reachable.
# Building without isolation makes the baked path the dev group's ninja, which
# persists. Having ninja on PATH is necessary and not sufficient; this list is
# the other half. Measured 2026-09-04 on exp/meson-python-namespace.
#
# Every member must be listed. Omitting one restores build isolation for it
# alone, and its baked path dies the same way.
[tool.uv]
no-build-isolation-package = [
    "pfsmgraph-dataseq",
    "pfsmgraph-align",
    "pfsmgraph-hmm",
    "pfsmgraph-hseg",
    "pfsmgraph-dl",
]

[dependency-groups]
# Family-wide dev tooling, synced by default for every member.
#
#   pytest  - the test runner (PRD §1). One parameterized suite per algorithm,
#             run against every available backend, so backend equivalence is
#             enforced rather than assumed (CLAUDE.md "Invariants").
#
# The build toolchain sits in the dev group rather than in build isolation
# because [tool.uv].no-build-isolation-package above turns isolation off for all
# five members -- so meson-python, cython and ninja have to come from the
# environment, and ninja additionally has to *stay* there, since the editable
# loader bakes its absolute path (PRD §6.1).
#
#   meson-python - build backend for all five members (ADR 0018)
#   cython       - align's NW kernel and hmm's Baum-Welch core; dormant until
#                  the first .pyx, but the build requires it now
#   ninja        - the loader's rebuild-on-import hook shells out to it
#   numpy        - a *build* requirement of align/hmm (their extensions compile
#                  against numpy headers). Without build isolation it cannot be
#                  supplied by build-system.requires alone, so it is listed here
#                  even though no member depends on it at development time.
dev = [
    "pytest>=8",
    "meson-python",
    "cython>=3.0",
    "ninja",
    "numpy>=2.1",
]

[tool.pytest.ini_options]
# -ra reports the reason for every skipped test in the run summary. Pytest's
# default prints a bare "s" and swallows the reason, which would defeat the
# unavailable-backend policy of ADR 0003: a CUDA backend skipped for absent
# hardware must say so in the run's own output, never silently. The companion
# mechanism -- a pytest_report_header hook printing the backend matrix once at
# session start -- landed 2026-09-01 in the root conftest.py, over _backends.py
# beside it. Both must stay at the rootdir: pytest_report_header is a startup
# hook, so a conftest under packages/*/tests/ has its hook discarded silently.
addopts = "-ra"
